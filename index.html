<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Άδειες</title>
  <meta name="description" content="Οι άδειές μας — ποιος, πότε, πόσες μένουν, και πότε είμαστε ελεύθεροι μαζί." />
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Άδειες" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/commissioner-greek-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/noto-serif-display-greek-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot-mark" aria-hidden="true"><span></span><span></span></div>
    <p id="boot-msg">Φόρτωση…</p>
  </div>

  <!-- Sign in -->
  <section id="auth" class="auth" hidden>
    <div class="auth-mark" aria-hidden="true"><span></span><span></span></div>
    <h1 class="auth-title">Άδειες</h1>
    <p class="auth-sub">Οι άδειές μας, σε ένα μέρος.</p>
    <form id="auth-form" class="auth-form" novalidate>
      <label class="field">
        <span>E-mail</span>
        <input type="email" name="email" autocomplete="username" inputmode="email" required />
      </label>
      <label class="field">
        <span>Κωδικός</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="form-error" id="auth-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Είσοδος</button>
      <p class="auth-hint" id="auth-hint" hidden>Demo — πάτα «Είσοδος» χωρίς στοιχεία.</p>
    </form>
  </section>

  <!-- App -->
  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" aria-label="Άδειες"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span>Άδειες</div>
        <div class="year-switch" role="group" aria-label="Έτος">
          <button class="icon-btn" data-action="year" data-delta="-1" aria-label="Προηγούμενο έτος">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <span id="year-label" class="year-label">2026</span>
          <button class="icon-btn" data-action="year" data-delta="1" aria-label="Επόμενο έτος">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <p id="demo-banner" class="demo-banner" hidden>Demo — τα δεδομένα μένουν μόνο σε αυτόν τον browser.</p>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <button class="fab" data-action="new-leave" aria-label="Νέα άδεια">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Νέα άδεια</span>
    </button>

    <nav class="tabbar" aria-label="Κύρια πλοήγηση">
      <button data-tab="leaves" aria-label="Άδειες">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z"/></svg>
        <span>Άδειες</span>
      </button>
      <button data-tab="together" aria-label="Μαζί">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg>
        <span>Μαζί</span>
      </button>
      <button data-tab="calendar" aria-label="Ημερολόγιο">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span>Ημερολόγιο</span>
      </button>
      <button data-tab="settings" aria-label="Ρυθμίσεις">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span>Ρυθμίσεις</span>
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
